name: Build debug APK
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: unzip -q FreedomGuard-phase1.zip
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Build
        working-directory: FreedomGuard
        run: gradle :app:assembleDebug :app:testDebugUnitTest --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: freedomguard-debug-apk
          path: FreedomGuard/app/build/outputs/apk/debug/app-debug.apk
